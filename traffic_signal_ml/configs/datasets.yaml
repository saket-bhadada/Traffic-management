# Dataset and Split Configuration
seed: 42
raw_data_dir: "data/raw"
unified_data_dir: "data/unified"
splits_dir: "data/splits"

split_ratios:
  train: 0.70
  val: 0.15
  test: 0.15

datasets:
  - workspace: "roboflow-100"
    project: "vehicles-q0x2v"
    version: 2
    format: "yolov8"
    license: "CC BY 4.0"
    max_images: 1500
    url: "https://universe.roboflow.com/roboflow-100/vehicles-q0x2v"
  - workspace: "indian-road-dataset"
    project: "indian-roads-detection"
    version: 1
    format: "yolov8"
    license: "CC BY 4.0"
    max_images: 2500
    url: "https://universe.roboflow.com/indian-road-dataset/indian-roads-detection"
  - workspace: "aadi-ek5md"
    project: "ambulance_detection-uzspj"
    version: 3
    format: "yolov8"
    license: "CC BY 4.0"
    max_images: 300
    pseudo_label_standard: true
    url: "https://universe.roboflow.com/aadi-ek5md/ambulance_detection-uzspj"
  - workspace: "senior-project-design-2"
    project: "emergency-vehicle-ambulances"
    version: 1
    format: "yolov8"
    license: "CC BY 4.0"
    pseudo_label_standard: true
    url: "https://universe.roboflow.com/senior-project-design-2/emergency-vehicle-ambulances"

detector:
  model_variant: "yolov8s"  # Switch between "yolov8n" and "yolov8s"
  epochs: 30
  imgsz: 640
  batch: 8
  workers: 0
  conf_threshold: 0.25
  iou_threshold: 0.45
  weights_path: "artifacts/detector_best.pt"
  metrics_output_path: "artifacts/detector_test_metrics.json"
